server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de React Router: cualquier ruta desconocida sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash se pueden cachear indefinidamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
